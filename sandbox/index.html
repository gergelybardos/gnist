<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gnist Showcase</title>

    <link rel="icon" type="image/x-icon" href="./public/favicon.ico">
    <link rel="stylesheet" href="./src/assets/style.css">
  </head>

  <body>
    <nav id="demo-nav">
      <div id="demo-list"></div>
    </nav>

    <div id="container">
      <div id="shortcuts-overlay">
        <span><kbd>Shift</kbd> + <kbd>H</kbd> HUD</span>
        <span><kbd>Shift</kbd> + <kbd>G</kbd> Grid</span>
        <span><kbd>Shift</kbd> + <kbd>B</kbd> Background</span>
        <span><kbd>Shift</kbd> + <kbd>S</kbd> Snapshot</span>
        <span><kbd>Shift</kbd> + <kbd>R</kbd> Report</span>
      </div>

      <canvas id="overlay-canvas"></canvas>
      <canvas id="particle-canvas"></canvas>

      <div id="footer-overlay">
        <span>Made with <a href="https://github.com/gergelybardos/gnist">Gnist</a></span> •
        <span><a href="https://github.com/gergelybardos/gnist/blob/main/LICENSE">MIT License</a></span> •
        <span>© 2026 <a href="https://github.com/gergelybardos">Gergely Bárdos</a></span>
      </div>
    </div>

    <script type="module" src="./src/navigation.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
